[package]
name = "shark-tauri-spike"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[lib]
name = "shark_tauri_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
shark-foundation = { path = "../shark-foundation" }
shark-books-core = { path = "../../product/shark-books-core" }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = { version = "=2.7.3", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
