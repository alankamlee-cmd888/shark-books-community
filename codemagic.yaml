workflows:
  sbc7b2-r6-autopilot-exact:
    name: SBC-7B2 R6 Autopilot — Windows exact SHA
    instance_type: windows_x2
    max_build_duration: 120
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: false
      cancel_previous_builds: true
    environment:
      vars:
        RUST_TOOLCHAIN: "1.98.1"
        CARGO_BUILD_JOBS: "1"
        CARGO_INCREMENTAL: "0"
    scripts:
      - name: Run exact c9fd45ae Windows R6 through Autopilot harness
        script: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:CM_BUILD_DIR\ci\autopilot_r6_codemagic_harness.ps1"
    artifacts:
      - autopilot-artifacts/SBC7B2_FT3_FT4_SUPERGATE_WINDOWS_*.zip
      - autopilot-artifacts/R6_AUTOPILOT_SUMMARY.json
