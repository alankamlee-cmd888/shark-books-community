workflows:
  sbc1e-ios-shell-proof:
    name: SBC-1E iOS Shell Proof
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: 26.4
      cocoapods: default
      vars:
        RUST_TOOLCHAIN: "1.98.1"
        CARGO_BUILD_JOBS: "1"
        CARGO_INCREMENTAL: "0"
    scripts:
      - name: Run SBC-1E evidence gate
        script: |
          chmod +x "$CM_BUILD_DIR/ci/run_sbc1e_codemagic.sh"
          "$CM_BUILD_DIR/ci/run_sbc1e_codemagic.sh"
    artifacts:
      - artifacts/SBC1E_CODEMAGIC_RESULT_*.zip
      - artifacts/SBC1E_SUMMARY.*
      - workspace/shark-tauri-spike/gen/apple/**/*.app
      - workspace/target/**/*.app
      - /tmp/xcodebuild_logs/*.log

  sbc1f-browser-adapter-smoke:
    name: SBC-1F Browser Adapter Interface Smoke
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: 26.4
      vars:
        RUST_TOOLCHAIN: "1.98.1"
        CARGO_BUILD_JOBS: "1"
        CARGO_INCREMENTAL: "0"
    scripts:
      - name: Run SBC-1F evidence gate
        script: |
          bash "$CM_BUILD_DIR/ci/run_sbc1f_codemagic.sh"
    artifacts:
      - artifacts/SBC1F_CODEMAGIC_RESULT_*.zip
      - artifacts/SBC1F_SUMMARY.*

  sbc-foundation-guard-macos:
    name: SBC Foundation Guard — macOS/Apple
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: false
      cancel_previous_builds: true
    environment:
      xcode: 26.4
      cocoapods: default
      vars:
        RUST_TOOLCHAIN: "1.98.1"
        CARGO_BUILD_JOBS: "1"
        CARGO_INCREMENTAL: "0"
    scripts:
      - name: Ensure rustup is available on Codemagic Mac host
        script: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version
          cargo --version
      - name: Run permanent SBC foundation guard on Mac/Apple
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          bash "$CM_BUILD_DIR/ci/run_sbc1g_codemagic.sh"
    artifacts:
      - artifacts/SBC1G_MAC_CODEMAGIC_RESULT_*.zip
      - artifacts/SBC1G_MAC_SUMMARY.*

  sbc-foundation-guard-windows:
    name: SBC Foundation Guard — Windows
    instance_type: windows_x2
    max_build_duration: 120
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: false
      cancel_previous_builds: true
    environment:
      vars:
        RUST_TOOLCHAIN: "1.98.1"
        CARGO_BUILD_JOBS: "1"
        CARGO_INCREMENTAL: "0"
    scripts:
      - name: Run permanent SBC foundation guard on Windows
        script: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:CM_BUILD_DIR\ci\run_sbc1g_windows.ps1"
    artifacts:
      - artifacts/SBC1G_WINDOWS_CODEMAGIC_RESULT_*.zip
      - artifacts/SBC1G_WINDOWS_SUMMARY.*

