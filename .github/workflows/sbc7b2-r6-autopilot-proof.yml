name: SBC Autopilot R6 Windows Exact-SHA Proof

on:
  push:
    branches:
      - sbc7b2-r6-autopilot-proof-20260924
    paths:
      - .github/workflows/sbc7b2-r6-autopilot-proof.yml

permissions:
  contents: read

jobs:
  r6-windows:
    name: R6 Windows SG0-SG8 exact c9fd45ae
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CANDIDATE_SHA: c9fd45ae67e977ba986706308ac6fae2d3bdf731
      HARNESS_BRANCH: sbc7b2-r6-autopilot-proof-20260924
    steps:
      - name: Clone exact candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Candidate = $env:CANDIDATE_SHA
          $RepoUrl = "https://github.com/$env:GITHUB_REPOSITORY.git"
          $CandidateDir = Join-Path $env:RUNNER_TEMP 'candidate'
          if(Test-Path $CandidateDir){ Remove-Item $CandidateDir -Recurse -Force }
          git clone $RepoUrl $CandidateDir
          if($LASTEXITCODE -ne 0){ throw 'candidate clone failed' }
          git -C $CandidateDir checkout --detach $Candidate
          if($LASTEXITCODE -ne 0){ throw 'candidate checkout failed' }
          $Head = (git -C $CandidateDir rev-parse HEAD).Trim()
          if($Head -ne $Candidate){ throw "candidate SHA mismatch: $Head" }
          if(@(git -C $CandidateDir status --porcelain).Count -ne 0){ throw 'candidate checkout not clean' }
          "candidate_sha=$Head" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Run exact candidate Windows R6 SG0-SG8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $CandidateDir = Join-Path $env:RUNNER_TEMP 'candidate'
          $Runner = Join-Path $CandidateDir 'ci\run_sbc7b2_supergate_windows.ps1'
          if(-not (Test-Path $Runner)){ throw 'candidate R6 runner missing' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $Runner -ExpectedHead $env:CANDIDATE_SHA
          if($LASTEXITCODE -ne 0){ throw "R6 runner failed with exit code $LASTEXITCODE" }

      - name: Emit exact R6 evidence identities
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Zip = Get-ChildItem (Join-Path $env:USERPROFILE 'Downloads') -Filter 'SBC7B2_FT3_FT4_SUPERGATE_WINDOWS_*.zip' |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if($null -eq $Zip){ throw 'R6 evidence ZIP not found' }
          $ZipSha = (Get-FileHash -Algorithm SHA256 $Zip.FullName).Hash.ToLowerInvariant()
          Write-Host "R6_EVIDENCE_ZIP=$($Zip.Name)"
          Write-Host "R6_EVIDENCE_SHA256=$ZipSha"
          $Extract = Join-Path $env:RUNNER_TEMP 'r6-evidence'
          if(Test-Path $Extract){ Remove-Item $Extract -Recurse -Force }
          Expand-Archive -Path $Zip.FullName -DestinationPath $Extract -Force
          foreach($name in @('SUMMARY.json','CANDIDATE_SHA.txt','EXPECTED_SHA.txt','BASE_SHA.txt','CHANGED_PATHS.txt','TOOLCHAIN.json')){
            $p=Join-Path $Extract $name
            if(Test-Path $p){ Write-Host "--- $name ---"; Get-Content $p -Raw }
          }
          $g=Join-Path $Extract 'gates'
          if(Test-Path $g){ Get-ChildItem $g -Filter '*.json' | Sort-Object Name | ForEach-Object { Write-Host "--- gates/$($_.Name) ---"; Get-Content $_.FullName -Raw } }
          Write-Host "R6_AUTOPILOT_CANDIDATE=$env:CANDIDATE_SHA"
          Write-Host 'R6_AUTOPILOT_PRODUCT_CANDIDATE_MODIFIED=false'
          Write-Host 'R6_AUTOPILOT_MERGE=false'
          Write-Host 'R6_AUTOPILOT_PUBLIC_RELEASE=false'
