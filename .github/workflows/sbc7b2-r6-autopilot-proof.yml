name: SBC Autopilot Runner Admission Probe

on:
  push:
    branches:
      - sbc7b2-r6-autopilot-proof-20260924
    paths:
      - .github/workflows/sbc7b2-r6-autopilot-proof.yml

permissions:
  contents: read

jobs:
  admission:
    name: Hosted runner admission probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove runner allocated
        shell: bash
        run: |
          set -euo pipefail
          echo "SBC_AUTOPILOT_RUNNER_ADMISSION=PASS"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "NO_PRODUCT_CANDIDATE_ACTION=true"
