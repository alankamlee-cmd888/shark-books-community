name: SBC-7B1 Bank Mutation Dev Check

on:
  push:
    branches:
      - sbc7b1-bank-mutation-persistence-20260911

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"

jobs:
  linux-foundation-dev-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch without marketplace actions
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch "$GITHUB_REF_NAME" --single-branch "https://github.com/$GITHUB_REPOSITORY.git" .
      - name: Select Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Materialise exact Beankeeper pin
        shell: bash
        run: python3 -B scripts/bootstrap_beankeeper.py
      - name: Foundation tests
        shell: bash
        run: cargo test --manifest-path workspace/Cargo.toml -p shark-foundation --locked --jobs 1
