name: SBC Foundation Guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbc-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"

jobs:
  classify:
    name: Classify foundation change
    runs-on: ubuntu-latest
    outputs:
      apple_native_changed: ${{ steps.classify.outputs.apple_native_changed }}
      dependency_changed: ${{ steps.classify.outputs.dependency_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          output="$(python3 scripts/check_sbc1g_change_control.py --classify-only --base-ref "$BASE_SHA")"
          printf '%s\n' "$output"
          while IFS='=' read -r key value; do
            case "$key" in
              apple_native_changed|dependency_changed) printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done <<< "$output"

  foundation-regression:
    name: Frozen foundation and regressions
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select frozen Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version
      - name: Run static and change-control guards
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          python3 scripts/check_frozen_baseline.py
          python3 scripts/check_sbc1g_change_control.py --base-ref "$BASE_SHA"
      - name: Materialise exact Beankeeper pin
        shell: bash
        run: python3 scripts/bootstrap_beankeeper.py
      - name: Resolve native workspace under frozen lock
        shell: bash
        run: cargo metadata --manifest-path workspace/Cargo.toml --locked --no-deps > /tmp/sbc-metadata.json
      - name: Run permanent Shark foundation regression suite
        shell: bash
        run: cargo test --manifest-path workspace/Cargo.toml -p shark-foundation --locked --jobs 1
      - name: Preserve SBC-1F browser contract smoke
        shell: bash
        run: cargo test --manifest-path browser/shark-browser-adapter-smoke/Cargo.toml --locked --jobs 1

  windows-compile:
    name: Windows production shell compile
    needs: classify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select frozen Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version
      - name: Guard frozen baseline
        shell: bash
        run: python scripts/check_frozen_baseline.py
      - name: Materialise exact Beankeeper pin
        shell: bash
        run: python scripts/bootstrap_beankeeper.py
      - name: Build production Tauri shell under frozen lock
        shell: bash
        run: cargo build --manifest-path workspace/Cargo.toml -p shark-tauri-spike --locked --jobs 1

  apple-native-compile:
    name: Apple native compile when graph changes
    needs: classify
    if: needs.classify.outputs.apple_native_changed == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select frozen Rust toolchain and Apple targets
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          rustc --version
          cargo --version
      - name: Guard frozen baseline before generated CI work
        shell: bash
        run: python3 scripts/check_frozen_baseline.py
      - name: Materialise exact Beankeeper pin
        shell: bash
        run: python3 scripts/bootstrap_beankeeper.py
      - name: Prepare temporary RGBA icon for Apple Tauri compile
        shell: bash
        run: python3 ci/prepare_rgba_png.py workspace/shark-tauri-spike/icons/icon.png
      - name: Compile shared foundation for physical iPhone/iPad target
        shell: bash
        run: cargo build --manifest-path workspace/Cargo.toml -p shark-foundation --target aarch64-apple-ios --locked --jobs 1
      - name: Compile Tauri shell for physical iPhone/iPad target
        shell: bash
        run: cargo build --manifest-path workspace/Cargo.toml -p shark-tauri-spike --target aarch64-apple-ios --locked --jobs 1
      - name: Compile shared foundation for Apple Simulator target
        shell: bash
        run: cargo build --manifest-path workspace/Cargo.toml -p shark-foundation --target aarch64-apple-ios-sim --locked --jobs 1
      - name: Compile Tauri shell for Apple Simulator target
        shell: bash
        run: cargo build --manifest-path workspace/Cargo.toml -p shark-tauri-spike --target aarch64-apple-ios-sim --locked --jobs 1
